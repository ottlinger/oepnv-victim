<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">oepnv-victim — public transport, real-world problems</title>
  <desc id="description">An original vector illustration of a delayed regional train, a technical fault, an emergency brake and a traffic jam. A departures board announces delays and a cancelled service.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="trainBody" x2="0" y2="1">
      <stop stop-color="#e6edf6"/>
      <stop offset="1" stop-color="#95a8bf"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#2a526b"/>
      <stop offset="1" stop-color="#11283c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#20324a" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1118" cy="76" r="215" fill="#1b3048" opacity=".25"/>
  <circle cx="117" cy="494" r="180" fill="#18394a" opacity=".16"/>
  <rect x="24" y="24" width="1232" height="592" rx="22" fill="none" stroke="#2b4058"/>

  <!-- Project heading, kept within GitHub's preview safe area. -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="60" y="54" width="30" height="28" rx="7" fill="#61dfca"/>
    <path d="M68 61h14v12H68z M70 76l-3 4m13-4 3 4" fill="none" stroke="#102537" stroke-width="2"/>
    <path d="M68 68h14" stroke="#102537" stroke-width="2"/>
    <text x="104" y="75" font-size="16" letter-spacing="2.2" fill="#9caec3">BERLIN / BRANDENBURG · JAVA CLI</text>
    <text x="58" y="149" font-size="76" font-weight="bold" letter-spacing="-3" fill="#f2f6fc">oepnv<tspan fill="#61dfca">-victim</tspan></text>
    <text x="62" y="192" font-size="25" fill="#bccbdc">Public transport. <tspan fill="#f2f6fc">Real-world problems.</tspan></text>
  </g>

  <!-- Urban backdrop and overhead railway wiring. -->
  <g fill="#15243a" stroke="#24364d" stroke-width="2">
    <path d="M60 446V329h70v117 M84 329v-29h46v146 M744 450V307h68v143 M817 451V337h52v114 M1132 441V385h67v56"/>
  </g>
  <g stroke="#344b63" stroke-width="3" fill="none">
    <path d="M96 271v269m742-269v269M96 271h742M96 289h742"/>
    <path d="M96 271l-21 27m763-27 22 27M310 290l-20 29h83l-20-29"/>
  </g>
  <path d="M370 289l9-15-2 17 11-5-9 20" stroke="#ffc064" stroke-width="3" fill="none"/>

  <!-- A stalled train: regional service, technical warning and pulled brake. -->
  <ellipse cx="465" cy="518" rx="357" ry="19" fill="#030b16" opacity=".8"/>
  <g filter="url(#shadow)">
    <path d="M196 329h554q44 0 44 43v105q0 23-23 23H157q-22 0-22-23v-79q0-39 61-69z" fill="url(#trainBody)" stroke="#dae6f4" stroke-width="2"/>
    <path d="M196 329h554q44 0 44 43v15H137q8-34 59-58z" fill="#d94251"/>
    <path d="M135 437h659v34H135z" fill="#d94251"/>
    <path d="M195 349h44v68h-80v-21q0-21 36-47z" fill="url(#glass)" stroke="#102639" stroke-width="3"/>
    <path d="M187 354l-19 44" stroke="#547b92" stroke-width="4" opacity=".8"/>
    <rect x="260" y="346" width="125" height="25" rx="5" fill="#162537"/>
    <text x="271" y="364" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="bold" fill="#ffc064">RB33  DELAYED</text>
    <g fill="url(#glass)" stroke="#152c41" stroke-width="3">
      <rect x="269" y="390" width="91" height="38" rx="7"/>
      <rect x="379" y="390" width="91" height="38" rx="7"/>
      <rect x="489" y="390" width="91" height="38" rx="7"/>
      <rect x="599" y="383" width="82" height="103" rx="6"/>
      <rect x="700" y="390" width="69" height="38" rx="7"/>
    </g>
    <path d="M640 384v102" stroke="#8097b0" stroke-width="2"/>
    <path d="M284 396l16 24m93-24 16 24m95-24 16 24m197-24 16 24" stroke="#527c93" stroke-width="3" opacity=".55"/>
    <g fill="#fff0b2">
      <rect x="148" y="445" width="22" height="11" rx="4"/>
      <rect x="219" y="445" width="22" height="11" rx="4"/>
    </g>
    <rect x="177" y="480" width="40" height="10" rx="3" fill="#293d52"/>
    <path d="M247 338v156" stroke="#667a93" stroke-width="3"/>
    <g fill="#112132" stroke="#647b95" stroke-width="4">
      <circle cx="238" cy="499" r="19"/>
      <circle cx="300" cy="499" r="19"/>
      <circle cx="682" cy="499" r="19"/>
      <circle cx="744" cy="499" r="19"/>
    </g>
    <g fill="#9caec3">
      <circle cx="238" cy="499" r="5"/>
      <circle cx="300" cy="499" r="5"/>
      <circle cx="682" cy="499" r="5"/>
      <circle cx="744" cy="499" r="5"/>
    </g>
  </g>

  <!-- Technical fault callout. -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <path d="M466 290v21l-20 18" fill="none" stroke="#ffc064" stroke-width="2"/>
    <rect x="399" y="227" width="213" height="64" rx="12" fill="#302a24" stroke="#b08043"/>
    <path d="M425 239l15 27h-30z" fill="#ffc064"/>
    <path d="M425 247v8m0 4v2" stroke="#302a24" stroke-width="3"/>
    <text x="450" y="252" font-size="16" font-weight="bold" fill="#ffd696">TECHNICAL FAULT</text>
    <text x="450" y="276" font-size="13" fill="#c0a88d">Service interrupted</text>
  </g>

  <!-- Emergency brake: a red pull handle inside the train, with a leader line. -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="626" y="306" width="192" height="42" rx="10" fill="#3a2030" stroke="#df697e"/>
    <circle cx="644" cy="327" r="5" fill="#ff6b81"/>
    <text x="657" y="332" font-size="14" font-weight="bold" fill="#ff9aae">BRAKE PULLED</text>
    <path d="M658 348v19l-23 23" stroke="#ff7d94" stroke-width="2" fill="none"/>
    <path d="M626 390v20" stroke="#ff9aae" stroke-width="3"/>
    <rect x="614" y="409" width="25" height="8" rx="3" fill="#ff6b81"/>
    <path d="M625 426v11m-17-20-7 6m43-6 7 6" stroke="#ff6b81" stroke-width="2"/>
  </g>

  <!-- Departures board with readable disruption information. -->
  <g filter="url(#shadow)" font-family="DejaVu Sans Mono, monospace">
    <rect x="874" y="218" width="333" height="172" rx="14" fill="#0a1729" stroke="#425c76" stroke-width="2"/>
    <rect x="874" y="218" width="333" height="43" rx="14" fill="#21334c"/>
    <path d="M874 245h333v16H874z" fill="#21334c"/>
    <circle cx="895" cy="240" r="4" fill="#61dfca"/>
    <text x="910" y="247" font-size="16" font-weight="bold" letter-spacing="2" fill="#dbe7f6">DEPARTURES</text>
    <text x="894" y="289" font-size="17" fill="#c3d2e4">RB33 15:22</text>
    <text x="1047" y="289" font-size="17" font-weight="bold" fill="#ffc064">+25 min</text>
    <path d="M893 303h294" stroke="#253b53"/>
    <text x="894" y="329" font-size="17" fill="#c3d2e4">RE3  15:40</text>
    <text x="1047" y="329" font-size="16" font-weight="bold" fill="#ff8293">CANCELLED</text>
    <text x="894" y="368" font-size="12" fill="#8b9fb8">Please expect further disruption.</text>
  </g>

  <!-- Road congestion, a bus and a red traffic light. -->
  <g>
    <path d="M847 510h367" stroke="#344b63" stroke-width="7"/>
    <path d="M859 524h43m20 0h43m20 0h43m20 0h43m20 0h43" stroke="#4b6078" stroke-width="2"/>
    <rect x="1168" y="411" width="6" height="97" rx="3" fill="#7286a0"/>
    <rect x="1154" y="401" width="33" height="66" rx="9" fill="#20334a" stroke="#536b84" stroke-width="2"/>
    <circle cx="1170" cy="416" r="7" fill="#ff5b72" filter="url(#glow)"/>
    <circle cx="1170" cy="416" r="7" fill="#ff5b72"/>
    <circle cx="1170" cy="434" r="6" fill="#463a2b"/>
    <circle cx="1170" cy="452" r="6" fill="#233e3c"/>
    <g fill="#dfa84f" stroke="#f6c56f" stroke-width="2">
      <rect x="1014" y="435" width="128" height="60" rx="8"/>
    </g>
    <g fill="#183347">
      <rect x="1024" y="444" width="25" height="21" rx="3"/>
      <rect x="1055" y="444" width="25" height="21" rx="3"/>
      <rect x="1086" y="444" width="25" height="21" rx="3"/>
      <rect x="1118" y="443" width="16" height="43" rx="3"/>
    </g>
    <path d="M916 482l11-21h43l17 21v17h-78v-13z" fill="#7191b1" stroke="#b1c7dc" stroke-width="2"/>
    <path d="M936 467h27l11 15h-47z" fill="#183347"/>
    <path d="M839 486l10-18h33l14 18v13h-65v-10z" fill="#d05870" stroke="#ef879b" stroke-width="2"/>
    <path d="M854 473h24l9 13h-41z" fill="#183347"/>
    <g fill="#102033" stroke="#768ca5" stroke-width="3">
      <circle cx="851" cy="500" r="8"/><circle cx="879" cy="500" r="8"/>
      <circle cx="930" cy="500" r="9"/><circle cx="972" cy="500" r="9"/>
      <circle cx="1038" cy="497" r="11"/><circle cx="1122" cy="497" r="11"/>
    </g>
    <path d="M904 467l3-6m-7 3 6-2m78 0 6 3" stroke="#ffc064" stroke-width="2"/>
  </g>

  <!-- Railway tracks and sleepers. -->
  <g stroke="#445a73" stroke-width="3">
    <path d="M75 536h739M75 548h739"/>
    <path d="M104 532v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21m36-21v21"/>
  </g>

  <!-- Footer: concise feature contrast to the disrupted scene. -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="61" y="574" width="156" height="26" rx="13" fill="#163b3c"/>
    <circle cx="76" cy="587" r="4" fill="#61dfca"/>
    <text x="87" y="592" font-size="12" font-weight="bold" fill="#8debdc">REAL-TIME DATA</text>
    <rect x="229" y="574" width="183" height="26" rx="13" fill="#1c2d43"/>
    <text x="246" y="592" font-size="12" font-weight="bold" fill="#c2d3e8">ROUTES · LEGS · DELAYS</text>
    <text x="870" y="591" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#8dabc4">github.com/ottlinger/oepnv-victim</text>
  </g>
</svg>
